name: Feature Request
description: Suggest an idea or enhancement for this project
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting a new feature? Explain the problem it solves and how you envision it working.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Clear description of what the problem or limitation is.
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or workflow you'd like to see added.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Any alternative solutions or workarounds considered?
    validations:
      required: false