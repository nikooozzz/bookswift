name: Bug Report
description: Create a report to help reproduce and fix an issue
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help resolve it faster.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Explain how to trigger the behavior step-by-step.
      placeholder: |
        1. Open Firefox
        2. Press Ctrl+Space
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Browser version, OS, extension version, etc.
      placeholder: Firefox 128 / Arch Linux / Bookswift v1.0.0
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Additional Context
      description: Paste any browser console errors or extra screenshot links here.
      render: shell